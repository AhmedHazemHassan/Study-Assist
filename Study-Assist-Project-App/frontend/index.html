<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyAssist</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" aria-label="Sidebar">
        <div class="logo-row">
          <div class="logo-icon" aria-hidden="true">
            <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 4h7a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H3z"></path>
              <path d="M21 4h-7a3 3 0 0 0-3 3v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
          </div>
          <h1 class="logo-title">StudyAssist</h1>
        </div>

        <nav class="nav" aria-label="Navigation">
          <button id="navUpload" class="nav-btn is-active" type="button">
            <span class="nav-ic" aria-hidden="true">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M17 8l-5-5-5 5"></path><path d="M12 3v12"></path></svg>
            </span>
            <span>Upload Center</span>
          </button>
          <button id="navReview" class="nav-btn" type="button" disabled>
            <span class="nav-ic" aria-hidden="true">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h7a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H3z"></path><path d="M21 4h-7a3 3 0 0 0-3 3v14a3 3 0 0 1 3-3h7z"></path></svg>
            </span>
            <span>Review Material</span>
          </button>
        </nav>

        <div class="status-wrap">
          <div class="status-box">
            <p class="status-title">Backend Status</p>
            <div class="status-row">
              <span id="backendDot" class="dot is-warn" aria-hidden="true"></span>
              <p id="backendText" class="status-text">checking</p>
            </div>
            <p class="status-title mt">Agent Status</p>
            <div class="status-row">
              <span id="agentDot" class="dot is-ok" aria-hidden="true"></span>
              <p id="agentText" class="status-text">Idle</p>
            </div>
          </div>

          <button id="resetBtn" class="reset-btn" type="button">
            <span aria-hidden="true">↻</span>
            <span>Start Over</span>
          </button>
        </div>
      </aside>

      <main class="main" aria-label="Main">
        <header class="topbar">
          <h2 class="topbar-title">Dashboard</h2>
          <div class="topbar-actions">
            <button class="icon-btn" type="button" title="Info" aria-label="Info">i</button>
            <div class="avatar" aria-hidden="true"></div>
          </div>
        </header>

        <div class="content" id="content" aria-live="polite"></div>

        <button id="chatToggle" class="chat-toggle" type="button" aria-expanded="false" aria-controls="chatPanel">
          <span id="chatToggleIcon" aria-hidden="true">💬</span>
        </button>

        <section id="chatPanel" class="chat" hidden>
          <div class="chat-header">
            <div class="chat-title">
              <span class="chat-ic" aria-hidden="true">✦</span>
              <span>Agent Feedback Loop</span>
            </div>
            <button id="chatClose" class="icon-btn dark" type="button" aria-label="Close chat">×</button>
          </div>
          <div id="chatBody" class="chat-body" role="log" aria-label="Messages"></div>
          <div class="chat-input-wrap">
            <div class="chat-input-rel">
              <input
                id="chatInput"
                type="text"
                class="chat-input"
                placeholder="Ask agents to revise (e.g. add emojis)..."
                autocomplete="off"
              />
              <button id="chatSend" class="chat-send" type="button" aria-label="Send">
                ➤
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
